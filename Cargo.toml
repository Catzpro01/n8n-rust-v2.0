# SPDX-License-Identifier: AGPL-3.0-or-later
[workspace]
members = ["crates/workflowd"]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.85.1"
license = "AGPL-3.0-or-later"
repository = "https://github.com/Catzpro01/n8n-rust-v2.0"

[workspace.dependencies]
axum = { version = "=0.8.9", default-features = false, features = ["http1", "json", "tokio"] }
axum-server = { version = "=0.7.3", default-features = false, features = ["tls-rustls-no-provider"] }
rusqlite = { version = "=0.40.2", default-features = false, features = ["backup", "bundled", "hooks", "limits"] }
rustls = { version = "=0.23.44", default-features = false, features = ["ring", "std", "tls12"] }
serde = { version = "=1.0.228", features = ["derive"] }
serde_json = "=1.0.145"
sha2 = "=0.10.9"
thiserror = "=2.0.16"
tokio = { version = "=1.53.1", default-features = false, features = ["macros", "rt-multi-thread", "signal", "sync", "time"] }
tracing = "=0.1.41"
tracing-subscriber = { version = "=0.3.23", default-features = false, features = ["fmt", "json"] }

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
panic = "abort"
strip = "symbols"
overflow-checks = true
